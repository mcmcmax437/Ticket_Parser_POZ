<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Poznań monitor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #efeff4;
      --text: #1c1c1e;
      --hint: #6d6d72;
      --card: #ffffff;
      --btn: #2481cc;
      --btn-text: #ffffff;
      --line: rgba(60, 60, 67, 0.12);
      --danger: #d64545;
      --ok: #1f8f4e;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e10;
        --text: #f2f2f7;
        --hint: #98989f;
        --card: #1c1c1e;
        --btn: #2f89ff;
        --btn-text: #ffffff;
        --line: rgba(255, 255, 255, 0.12);
        --danger: #ff6b6b;
        --ok: #3ddc84;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0; }
    .langs { display: flex; gap: 6px; }
    .langs button, .tabs button, .chips button, .actions button, .run-stop, .stop-all, .text-btn {
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .langs button {
      background: var(--card);
      color: var(--hint);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .langs button.on { color: var(--btn); font-weight: 700; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .tabs button { background: transparent; color: var(--hint); border-radius: 9px; padding: 10px; }
    .tabs button.on { background: var(--btn); color: var(--btn-text); font-weight: 650; }
    .running {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .running.on { box-shadow: inset 3px 0 0 var(--ok); }
    .running-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .running-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      color: var(--text);
    }
    .count {
      min-width: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--ok);
      color: #06210f;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .running-empty { margin: 6px 0 0; color: var(--hint); font-size: 13px; }
    .run {
      margin-top: 10px;
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 12px 12px;
    }
    .run.mine { box-shadow: inset 3px 0 0 var(--btn); }
    .run-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .run-badge { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      flex: none;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
    .kind {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--btn);
    }
    .run h3 { margin: 8px 0 0; font-size: 16px; line-height: 1.3; }
    .run-meta { margin: 4px 0 0; color: var(--hint); font-size: 13px; line-height: 1.35; }
    .run-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .text-btn { background: transparent; color: var(--btn); padding: 0; font-size: 13px; font-weight: 700; }
    .mine-tag { color: var(--btn); font-size: 13px; font-weight: 700; }
    .run-stop {
      flex: none;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger) !important;
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 36px;
      font-size: 14px;
      font-weight: 700;
    }
    .stop-all {
      display: block;
      width: 100%;
      margin-top: 8px;
      background: transparent;
      color: var(--danger);
      padding: 8px;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2, .draft {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--hint);
    }
    .draft { font-weight: 700; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 4px; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    select:disabled { opacity: 0.55; }
    .field { margin-bottom: 10px; }
    .manual { margin-top: 6px; }
    .window { margin: 8px 0 0; font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button {
      background: var(--bg);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
    }
    .chips button.on { background: var(--btn); color: var(--btn-text); }
    .actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .actions button { border-radius: 12px; padding: 12px; font-weight: 700; }
    .actions button:disabled { opacity: 0.55; cursor: default; }
    .go { background: var(--btn); color: var(--btn-text); }
    .hint { margin: 8px 2px 0; color: var(--hint); font-size: 13px; }
    .hidden { display: none; }
    .toast {
      position: sticky;
      bottom: 8px;
      background: var(--text);
      color: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .preview {
      background: #fff4d6;
      color: #6a4b00;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div id="preview" class="preview hidden">Browser preview. Inside Telegram this screen opens from the bot.</div>
    <header>
      <h1 id="title">Poznań monitor</h1>
      <div class="langs">
        <button type="button" id="lang-en" data-lang="en">EN</button>
        <button type="button" id="lang-uk" data-lang="uk">UK</button>
      </div>
    </header>
    <div class="tabs">
      <button type="button" id="tab-tickets" class="on">Appointments</button>
      <button type="button" id="tab-cars">Cars</button>
    </div>
    <section id="running" class="running" aria-live="polite">
      <div class="running-head">
        <h2 id="running-title">No search is running</h2>
        <span id="running-count" class="count hidden">0</span>
      </div>
      <p id="running-empty" class="running-empty"></p>
      <div id="running-list"></div>
      <button type="button" id="stop-all" class="stop-all hidden">Stop all</button>
    </section>

    <section id="panel-tickets">
      <p id="draft-tickets" class="draft hidden"></p>
      <div class="card">
        <h2 id="lbl-service">Service</h2>
        <div id="services" class="chips"></div>
      </div>
      <div class="card">
        <h2 id="lbl-when">When</h2>
        <div class="grid">
          <div class="field">
            <label id="lbl-from" for="from">From</label>
            <input id="from" type="date" />
          </div>
          <div class="field">
            <label id="lbl-until" for="until">Until</label>
            <input id="until" type="date" />
          </div>
        </div>
        <label id="lbl-cases">Cases</label>
        <div id="cases" class="chips"></div>
        <div class="field" style="margin-top:12px">
          <label id="lbl-interval" for="interval">Check every</label>
          <select id="interval">
            <option value="60">1 min</option>
            <option value="180">3 min</option>
            <option value="300">5 min</option>
            <option value="600">10 min</option>
            <option value="900">15 min</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="go" id="start-ticket">Start search</button>
      </div>
      <p id="hint-ticket" class="hint"></p>
    </section>

    <section id="panel-cars" class="hidden">
      <p id="draft-cars" class="draft hidden"></p>
      <div class="card">
        <h2 id="lbl-car">Car</h2>
        <div class="grid">
          <div class="field"><label id="lbl-make" for="make">Make</label><select id="make"></select></div>
          <div class="field"><label id="lbl-model" for="model">Model</label><select id="model"></select></div>
          <div class="field"><label id="lbl-year-from" for="year-from">Year from</label><select id="year-from"></select></div>
          <div class="field"><label id="lbl-year-to" for="year-to">Year to</label><select id="year-to"></select></div>
          <div class="field">
            <label id="lbl-price-from" for="price-from">Price from</label>
            <select id="price-from"></select>
            <input id="price-from-custom" class="manual" inputmode="numeric" autocomplete="off" enterkeyhint="done" />
          </div>
          <div class="field">
            <label id="lbl-price-to" for="price-to">Price to</label>
            <select id="price-to"></select>
            <input id="price-to-custom" class="manual" inputmode="numeric" autocomplete="off" enterkeyhint="done" />
          </div>
          <div class="field"><label id="lbl-mileage" for="mileage">Max km</label><select id="mileage"></select></div>
          <div class="field"><label id="lbl-region" for="region">Region</label><select id="region"></select></div>
        </div>
        <div class="field">
          <label id="lbl-tolerance" for="price-tolerance">Tolerance, %</label>
          <input id="price-tolerance" inputmode="numeric" autocomplete="off" enterkeyhint="done" />
        </div>
        <div id="tolerance-chips" class="chips"></div>
        <p id="price-window" class="window"></p>
      </div>
      <div class="card">
        <h2 id="lbl-fuel">Fuel</h2>
        <div id="fuels" class="chips"></div>
      </div>
      <div class="card">
        <h2 id="lbl-gear">Gearbox</h2>
        <div id="gears" class="chips"></div>
      </div>
      <div class="card">
        <label id="lbl-car-interval" for="car-interval">Check every</label>
        <select id="car-interval">
          <option value="300">5 min</option>
          <option value="600">10 min</option>
          <option value="900">15 min</option>
          <option value="1800">30 min</option>
        </select>
      </div>
      <div class="actions">
        <button type="button" class="go" id="start-car">Start car search</button>
      </div>
      <p id="hint-car" class="hint"></p>
    </section>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script>
    const COPY = {
      en: {
        title: "Poznań monitor", tickets: "Appointments", cars: "Cars",
        runningNone: "No search is running",
        runningHint: "Set the filters and start. Several searches can run at once, and each one stops on its own.",
        service: "Service", when: "Dates", from: "From", until: "Until", cases: "Number of cases",
        interval: "Check every", car: "The car", fuel: "Fuel", gear: "Gearbox",
        make: "Make", model: "Model", yearFrom: "Year from", yearTo: "Year to",
        priceFrom: "Price from, zł", priceTo: "Price to, zł", mileage: "Max mileage, km", region: "Region",
        manualPrice: "or type", tolerance: "Tolerance, %",
        windowNone: "Set a price. The tolerance then widens those limits.",
        windowExact: "Shown exactly:", windowWide: "Also considered:",
        badTolerance: "Tolerance has to be from 0 to 100.",
        badPriceValue: "Type a price from 1 to 20 000 000.",
        start: "Start search", startCar: "Start car search", addSearch: "Add this search",
        alreadyBtn: "This search is running", stop: "Stop", stopAll: "Stop all",
        confirmStopAll: "Stop every running search?",
        any: "Any", choose: "Choose",
        saved: "Saved", started: "Search started. It keeps running while you set up another.",
        stopped: "Search stopped.", stoppedAll: "All searches stopped.",
        notRunning: "That search is already stopped.",
        already: "This exact search is already running.",
        theseFilters: "These filters", showFilters: "Show filters",
        newSearch: "New search", filtersOfRunning: "Running search",
        hintIdle: "Several searches can run together. Each one keeps its own filters.",
        hintAdd: "This adds another search. The ones above keep running.",
        hintMine: "These filters are already running. Stop that search in the list above.",
        hintInterval: "Its check interval stays as shown above. Stop it and start again to change the interval.",
        fromShort: "from", untilShort: "to", km: "km",
        badRange: "The start date has to be on or before the end date.",
        badYear: "Year from has to be on or before year to.",
        badPrice: "Price from has to be on or before price to.",
        catalogError: "The car list did not load. Refresh the page.",
        needMake: "Choose the car make first.",
        preview: "Browser preview. Inside Telegram this screen opens from the bot."
      },
      uk: {
        title: "Монітор Poznań", tickets: "Записи", cars: "Авто",
        runningNone: "Немає активних пошуків",
        runningHint: "Налаштуйте фільтри і запустіть. Можна тримати кілька пошуків одночасно і зупиняти кожен окремо.",
        service: "Послуга", when: "Дати", from: "Від", until: "До", cases: "Кількість справ",
        interval: "Перевіряти кожні", car: "Авто", fuel: "Паливо", gear: "Коробка",
        make: "Марка", model: "Модель", yearFrom: "Рік від", yearTo: "Рік до",
        priceFrom: "Ціна від, zł", priceTo: "Ціна до, zł", mileage: "Макс. пробіг, км", region: "Регіон",
        manualPrice: "або вручну", tolerance: "Похибка, %",
        windowNone: "Вкажіть ціну — похибка розширить ці межі.",
        windowExact: "Покаже рівно:", windowWide: "Також розглянемо:",
        badTolerance: "Похибка має бути від 0 до 100.",
        badPriceValue: "Вкажіть ціну від 1 до 20 000 000.",
        start: "Почати пошук", startCar: "Шукати авто", addSearch: "Додати цей пошук",
        alreadyBtn: "Цей пошук уже йде", stop: "Стоп", stopAll: "Зупинити всі",
        confirmStopAll: "Зупинити всі пошуки?",
        any: "Будь-яке", choose: "Оберіть",
        saved: "Збережено", started: "Пошук запущено. Він працює, поки ви налаштовуєте наступний.",
        stopped: "Пошук зупинено.", stoppedAll: "Усі пошуки зупинено.",
        notRunning: "Цей пошук уже зупинено.",
        already: "Такий пошук уже запущено.",
        theseFilters: "Ці фільтри", showFilters: "Показати фільтри",
        newSearch: "Новий пошук", filtersOfRunning: "Запущений пошук",
        hintIdle: "Можна запустити кілька пошуків. У кожного свої фільтри і своя кнопка стоп.",
        hintAdd: "Це додасть ще один пошук. Ті, що вище, продовжать працювати.",
        hintMine: "Ці фільтри вже шукають. Зупинити можна в списку вище.",
        hintInterval: "Інтервал лишається таким, як у списку. Щоб змінити його, зупиніть пошук і запустіть знову.",
        fromShort: "від", untilShort: "до", km: "км",
        badRange: "Дата «від» має бути не пізніше дати «до».",
        badYear: "Рік «від» має бути не пізніше року «до».",
        badPrice: "Ціна «від» має бути не більшою за ціну «до».",
        catalogError: "Список авто не завантажився. Оновіть сторінку.",
        needMake: "Спочатку оберіть марку.",
        preview: "Перегляд у браузері. У Telegram цей екран відкривається з бота."
      }
    };

    const tg = window.Telegram && window.Telegram.WebApp;
    const preview = !(tg && tg.initData);
    let state = null;
    let options = null;
    let lang = "en";
    let tab = location.hash === "#cars" || new URLSearchParams(location.search).get("tab") === "cars" ? "cars" : "tickets";
    let busy = 0;
    let epoch = 0;
    let drawnKey = "";

    function text(key) { return COPY[lang][key]; }

    function applyTheme() {
      if (!tg) return;
      const p = tg.themeParams || {};
      const root = document.documentElement;
      if (p.bg_color) root.style.setProperty("--bg", p.bg_color);
      if (p.text_color) root.style.setProperty("--text", p.text_color);
      if (p.hint_color) root.style.setProperty("--hint", p.hint_color);
      if (p.secondary_bg_color) root.style.setProperty("--card", p.secondary_bg_color);
      if (p.button_color) root.style.setProperty("--btn", p.button_color);
      if (p.button_text_color) root.style.setProperty("--btn-text", p.button_text_color);
    }

    async function api(path, body) {
      const headers = { "Content-Type": "application/json" };
      if (tg && tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
      else headers["X-Local-Preview"] = "1";
      const response = await fetch(path, {
        method: body ? "POST" : "GET",
        headers,
        body: body ? JSON.stringify(body) : undefined
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || "Request failed");
      return payload;
    }

    function toast(message) {
      const node = document.getElementById("toast");
      node.textContent = message;
      node.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => node.classList.add("hidden"), 2400);
    }

    async function commit(request) {
      const mine = ++epoch;
      busy += 1;
      try {
        const next = await request();
        if (mine !== epoch) return null;
        return next;
      } finally {
        busy -= 1;
      }
    }

    function chip(container, label, on, click) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.className = on ? "on" : "";
      button.onclick = click;
      container.appendChild(button);
    }

    function countLabel(count) {
      if (lang === "en") return count === 1 ? "1 search running" : count + " searches running";
      const mod10 = count % 10;
      const mod100 = count % 100;
      let word = "пошуків";
      if (mod10 === 1 && mod100 !== 11) word = "пошук";
      else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = "пошуки";
      return count === 1 ? "1 пошук триває" : count + " " + word + " тривають";
    }

    function casesLabel(count) {
      const n = Number(count);
      if (lang === "en") return n === 1 ? "1 case" : n + " cases";
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return n + " справа";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return n + " справи";
      return n + " справ";
    }

    function everyLabel(seconds) {
      const minutes = Math.max(1, Math.round(Number(seconds) / 60));
      if (lang === "uk") return minutes === 1 ? "щохвилини" : "кожні " + minutes + " хв";
      return minutes === 1 ? "every 1 min" : "every " + minutes + " min";
    }

    function prettyDate(iso) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
      return match ? match[3] + "." + match[2] + "." + match[1] : "";
    }

    function amount(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString("pl-PL") : value;
    }

    function lookup(list, id) {
      if (!id) return "";
      const found = (list || []).find((item) => (typeof item === "string" ? item : item.id) === id);
      if (!found) {
        return String(id).replace(/-/g, " ").replace(/(^|\s)\S/g, (chunk) => chunk.toUpperCase());
      }
      return typeof found === "string" ? found : found.label;
    }

    function serviceName(item) {
      const found = (state.services || []).find((service) => service.id === item.service_key);
      return found ? found[lang] : item.service_key;
    }

    function carTitle(item) {
      const makes = (options && options.makes) || [];
      const models = (options && options.models && options.models[item.make]) || [];
      return [lookup(makes, item.make), item.model ? lookup(models, item.model) : ""].filter(Boolean).join(" ") || text("car");
    }

    function rangeLabel(from, to, unit) {
      const suffix = unit ? " " + unit : "";
      if (from && to) return amount(from) + "–" + amount(to) + suffix;
      if (from) return text("fromShort") + " " + amount(from) + suffix;
      if (to) return text("untilShort") + " " + amount(to) + suffix;
      return "";
    }

    function carMeta(item) {
      const parts = [];
      const years = rangeLabel(item.year_from, item.year_to, "");
      const prices = rangeLabel(item.price_from, item.price_to, "zł");
      if (years) parts.push(years);
      if (prices) {
        const tolerance = Number(item.price_tolerance || 0);
        parts.push(tolerance ? prices + " ±" + tolerance + "%" : prices);
      }
      if (item.mileage_to) parts.push("≤ " + amount(item.mileage_to) + " " + text("km"));
      if (item.region) parts.push(lookup((options && options.regions) || [], item.region));
      const fuel = (state.fuels || []).find((entry) => entry.id === item.fuel_type);
      const gear = (state.gears || []).find((entry) => entry.id === item.gearbox);
      if (fuel) parts.push(fuel.label);
      if (gear) parts.push(gear.label);
      parts.push(everyLabel(item.poll_interval_seconds));
      return parts.join(" · ");
    }

    function ticketMeta(item) {
      const end = prettyDate(item.notify_before_date);
      const start = prettyDate(item.notify_from_date);
      const dates = start ? start + " → " + end : "→ " + end;
      return [dates, casesLabel(item.num_cases), everyLabel(item.poll_interval_seconds)].join(" · ");
    }

    function visibleSearches() {
      const tickets = (state.ticket_searches || []).map((item) => Object.assign({ kind: "ticket" }, item));
      const cars = (state.car_searches || []).map((item) => Object.assign({ kind: "car" }, item));
      return tab === "cars" ? cars.concat(tickets) : tickets.concat(cars);
    }

    function renderSearch(item) {
      const card = document.createElement("article");
      const sameTab = (item.kind === "car") === (tab === "cars");
      card.className = "run" + (item.current && sameTab ? " mine" : "");

      const top = document.createElement("div");
      top.className = "run-top";
      const badge = document.createElement("div");
      badge.className = "run-badge";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.setAttribute("aria-hidden", "true");
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = item.kind === "car" ? text("cars") : text("tickets");
      badge.append(dot, kind);
      if (item.current && sameTab) {
        const tag = document.createElement("span");
        tag.className = "mine-tag";
        tag.textContent = text("theseFilters");
        badge.append(tag);
      }

      const titleText = item.kind === "car" ? carTitle(item) : serviceName(item);
      const stop = document.createElement("button");
      stop.type = "button";
      stop.className = "run-stop";
      stop.textContent = text("stop");
      stop.setAttribute("aria-label", text("stop") + ": " + titleText);
      stop.onclick = () => stopSearch(item.kind, item.key).catch((err) => toast(err.message));
      top.append(badge, stop);

      const title = document.createElement("h3");
      title.textContent = titleText;
      const meta = document.createElement("p");
      meta.className = "run-meta";
      meta.textContent = item.kind === "car" ? carMeta(item) : ticketMeta(item);
      card.append(top, title, meta);

      if (!(item.current && sameTab)) {
        const actions = document.createElement("div");
        actions.className = "run-actions";
        const open = document.createElement("button");
        open.type = "button";
        open.className = "text-btn";
        open.textContent = text("showFilters");
        open.onclick = () => openSearch(item).catch((err) => toast(err.message));
        actions.append(open);
        card.append(actions);
      }
      return card;
    }

    function paintChrome() {
      const copy = COPY[lang];
      const tickets = state.ticket_searches || [];
      const cars = state.car_searches || [];
      const total = tickets.length + cars.length;
      document.getElementById("preview").textContent = copy.preview;
      document.getElementById("title").textContent = copy.title;
      document.getElementById("tab-tickets").textContent = tickets.length ? copy.tickets + " · " + tickets.length : copy.tickets;
      document.getElementById("tab-cars").textContent = cars.length ? copy.cars + " · " + cars.length : copy.cars;
      document.getElementById("lang-en").className = lang === "en" ? "on" : "";
      document.getElementById("lang-uk").className = lang === "uk" ? "on" : "";
      document.getElementById("tab-tickets").className = tab === "tickets" ? "on" : "";
      document.getElementById("tab-cars").className = tab === "cars" ? "on" : "";
      document.getElementById("panel-tickets").classList.toggle("hidden", tab !== "tickets");
      document.getElementById("panel-cars").classList.toggle("hidden", tab !== "cars");

      const section = document.getElementById("running");
      section.classList.toggle("on", total > 0);
      document.getElementById("running-title").textContent = total ? countLabel(total) : copy.runningNone;
      const count = document.getElementById("running-count");
      count.textContent = String(total);
      count.classList.toggle("hidden", total === 0);
      const empty = document.getElementById("running-empty");
      empty.textContent = copy.runningHint;
      empty.classList.toggle("hidden", total > 0);
      document.getElementById("stop-all").textContent = copy.stopAll;
      document.getElementById("stop-all").classList.toggle("hidden", total < 2);

      const searches = visibleSearches();
      const key = lang + "|" + tab + "|" + JSON.stringify(searches);
      if (key !== drawnKey) {
        drawnKey = key;
        const list = document.getElementById("running-list");
        list.replaceChildren();
        searches.forEach((item) => list.appendChild(renderSearch(item)));
      }

      ["ticket", "car"].forEach((kind) => {
        const list = kind === "car" ? cars : tickets;
        const draft = document.getElementById(kind === "car" ? "draft-cars" : "draft-tickets");
        if (!list.length || (kind === "car") !== (tab === "cars")) {
          draft.classList.add("hidden");
        } else {
          draft.classList.remove("hidden");
          draft.textContent = list.some((item) => item.current) ? copy.filtersOfRunning : copy.newSearch;
        }
        const action = actionState(kind);
        const button = document.getElementById(kind === "car" ? "start-car" : "start-ticket");
        const hint = document.getElementById(kind === "car" ? "hint-car" : "hint-ticket");
        button.textContent = action.label;
        button.disabled = action.disabled;
        hint.textContent = action.hint;
      });

      document.getElementById("lbl-service").textContent = copy.service;
      document.getElementById("lbl-when").textContent = copy.when;
      document.getElementById("lbl-from").textContent = copy.from;
      document.getElementById("lbl-until").textContent = copy.until;
      document.getElementById("lbl-cases").textContent = copy.cases;
      document.getElementById("lbl-interval").textContent = copy.interval;
      document.getElementById("lbl-car").textContent = copy.car;
      document.getElementById("lbl-fuel").textContent = copy.fuel;
      document.getElementById("lbl-gear").textContent = copy.gear;
      document.getElementById("lbl-make").textContent = copy.make;
      document.getElementById("lbl-model").textContent = copy.model;
      document.getElementById("lbl-year-from").textContent = copy.yearFrom;
      document.getElementById("lbl-year-to").textContent = copy.yearTo;
      document.getElementById("lbl-price-from").textContent = copy.priceFrom;
      document.getElementById("lbl-price-to").textContent = copy.priceTo;
      document.getElementById("lbl-tolerance").textContent = copy.tolerance;
      document.getElementById("lbl-mileage").textContent = copy.mileage;
      document.getElementById("lbl-region").textContent = copy.region;
      document.getElementById("lbl-car-interval").textContent = copy.interval;
    }

    function actionState(kind) {
      const copy = COPY[lang];
      const list = kind === "car" ? state.car_searches || [] : state.ticket_searches || [];
      const mine = list.find((item) => item.current);
      const total = (state.ticket_searches || []).length + (state.car_searches || []).length;
      const selected = Number(document.getElementById(kind === "car" ? "car-interval" : "interval").value);
      if (mine) {
        return {
          label: copy.alreadyBtn,
          disabled: true,
          hint: mine.poll_interval_seconds !== selected ? copy.hintInterval : copy.hintMine
        };
      }
      if (total > 0) return { label: copy.addSearch, disabled: false, hint: copy.hintAdd };
      return {
        label: kind === "car" ? copy.startCar : copy.start,
        disabled: false,
        hint: copy.hintIdle
      };
    }

    function paint() {
      const cfg = state.config;
      const services = document.getElementById("services");
      services.replaceChildren();
      state.services.forEach((item) => chip(services, item[lang], item.id === cfg.service_key, () => save({ service_key: item.id }).catch((err) => toast(err.message))));
      const cases = document.getElementById("cases");
      cases.replaceChildren();
      [1, 2, 3].forEach((n) => chip(cases, String(n), Number(cfg.num_cases) === n, () => save({ num_cases: n }).catch((err) => toast(err.message))));

      document.getElementById("from").value = cfg.notify_from_date || "";
      document.getElementById("until").value = cfg.notify_before_date || "";
      paintIntervals();
      selectInterval("interval", cfg.poll_interval_seconds);
      const lists = options || { makes: [], models: {}, regions: [], years: [], prices: [], mileages: [] };
      fillSelect("make", lists.makes, cfg.car_make, text("choose"));
      const models = lists.models[cfg.car_make] || [];
      fillSelect("model", models, cfg.car_model, text("any"));
      document.getElementById("model").disabled = !cfg.car_make;
      fillSelect("year-from", lists.years, cfg.car_year_from, text("any"));
      fillSelect("year-to", lists.years, cfg.car_year_to, text("any"));
      paintPrice("price-from", "price-from-custom", cfg.car_price_from);
      paintPrice("price-to", "price-to-custom", cfg.car_price_to);
      paintTolerance(cfg.car_price_tolerance);
      fillSelect("mileage", lists.mileages, cfg.car_mileage_to, text("any"), amount);
      fillSelect("region", lists.regions, cfg.car_region, text("any"));
      selectInterval("car-interval", cfg.car_poll_interval_seconds);

      const fuels = document.getElementById("fuels");
      fuels.replaceChildren();
      chip(fuels, text("any"), !cfg.car_fuel_type, () => save({ car_fuel_type: "" }).catch((err) => toast(err.message)));
      state.fuels.forEach((item) => chip(fuels, item.label, item.id === cfg.car_fuel_type, () => save({ car_fuel_type: item.id }).catch((err) => toast(err.message))));
      const gears = document.getElementById("gears");
      gears.replaceChildren();
      chip(gears, text("any"), !cfg.car_gearbox, () => save({ car_gearbox: "" }).catch((err) => toast(err.message)));
      state.gears.forEach((item) => chip(gears, item.label, item.id === cfg.car_gearbox, () => save({ car_gearbox: item.id }).catch((err) => toast(err.message))));
      paintChrome();
    }

    function paintIntervals() {
      const labels = lang === "uk"
        ? { 60: "1 хв", 180: "3 хв", 300: "5 хв", 600: "10 хв", 900: "15 хв", 1800: "30 хв" }
        : { 60: "1 min", 180: "3 min", 300: "5 min", 600: "10 min", 900: "15 min", 1800: "30 min" };
      ["interval", "car-interval"].forEach((id) => {
        Array.from(document.getElementById(id).options).forEach((option) => {
          if (labels[option.value]) option.textContent = labels[option.value];
        });
      });
    }

    function selectInterval(id, seconds) {
      const select = document.getElementById(id);
      Array.from(select.querySelectorAll("option[data-custom]")).forEach((option) => option.remove());
      const value = String(seconds || "");
      if (value && !Array.from(select.options).some((option) => option.value === value)) {
        const option = document.createElement("option");
        option.value = value;
        option.dataset.custom = "1";
        option.textContent = everyLabel(Number(value));
        select.appendChild(option);
      }
      if (value) select.value = value;
    }

    function fillSelect(id, items, current, emptyLabel, format) {
      const select = document.getElementById(id);
      select.replaceChildren();
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = emptyLabel;
      select.appendChild(empty);
      (items || []).forEach((item) => {
        const option = document.createElement("option");
        const value = typeof item === "string" ? item : item.id;
        const label = typeof item === "string" ? item : item.label;
        option.value = value;
        option.textContent = format ? format(value) : label;
        select.appendChild(option);
      });
      const wanted = current == null ? "" : String(current);
      select.value = Array.from(select.options).some((option) => option.value === wanted) ? wanted : "";
    }

    function paintPrice(selectId, manualId, current) {
      const lists = options || { prices: [] };
      fillSelect(selectId, lists.prices, "", text("any"), amount);
      const select = document.getElementById(selectId);
      const manual = document.getElementById(manualId);
      const wanted = current == null ? "" : String(current);
      const known = Boolean(wanted) && Array.from(select.options).some((option) => option.value === wanted);
      select.value = known ? wanted : "";
      manual.value = wanted && !known ? wanted : "";
      manual.placeholder = text("manualPrice");
    }

    function paintTolerance(current) {
      const value = current == null || current === "" ? "0" : String(current);
      const input = document.getElementById("price-tolerance");
      input.value = value === "0" ? "" : value;
      input.placeholder = "0";
      const box = document.getElementById("tolerance-chips");
      box.replaceChildren();
      [0, 5, 10, 15, 20].forEach((step) => {
        chip(box, step ? "±" + step + "%" : "0%", String(step) === String(Number(value) || 0), () => {
          save({ car_price_tolerance: String(step) }).catch((err) => toast(err.message));
        });
      });
      paintWindow();
    }

    function statedAmount(selectId, manualId) {
      const typed = document.getElementById(manualId).value.replace(/\D/g, "");
      if (typed) return Number(typed);
      const selected = document.getElementById(selectId).value;
      return selected ? Number(selected) : 0;
    }

    function widen(amount, percent, upper) {
      if (!amount) return 0;
      const delta = Math.floor((amount * percent + 50) / 100);
      return upper ? amount + delta : Math.max(0, amount - delta);
    }

    function paintWindow() {
      const node = document.getElementById("price-window");
      const from = statedAmount("price-from", "price-from-custom");
      const to = statedAmount("price-to", "price-to-custom");
      const typed = document.getElementById("price-tolerance").value.replace(/\D/g, "");
      const percent = typed ? Number(typed) : 0;
      if (!from && !to) {
        node.textContent = text("windowNone");
        return;
      }
      const low = from ? widen(from, Math.min(percent, 100), false) : 0;
      const high = to ? widen(to, Math.min(percent, 100), true) : 0;
      const band = rangeLabel(low ? String(low) : "", high ? String(high) : "", "zł");
      node.textContent = (percent ? text("windowWide") : text("windowExact")) + " " + band;
    }

    function readPrice(selectId, manualId) {
      const typed = document.getElementById(manualId).value.replace(/\D/g, "");
      if (typed) {
        const number = Number(typed);
        if (number < 1 || number > 20000000) return { error: true, value: "" };
        return { error: false, value: String(number) };
      }
      return { error: false, value: document.getElementById(selectId).value.trim() };
    }

    function readTolerance() {
      const typed = document.getElementById("price-tolerance").value.replace(/\D/g, "");
      if (!typed) return { error: false, value: "0" };
      const number = Number(typed);
      if (number > 100) return { error: true, value: "" };
      return { error: false, value: String(number) };
    }

    function formPatch() {
      const fromPrice = readPrice("price-from", "price-from-custom");
      const toPrice = readPrice("price-to", "price-to-custom");
      const tolerance = readTolerance();
      return {
        notify_from_date: document.getElementById("from").value,
        notify_before_date: document.getElementById("until").value,
        poll_interval_seconds: Number(document.getElementById("interval").value),
        car_make: document.getElementById("make").value.trim(),
        car_model: document.getElementById("model").value.trim(),
        car_year_from: document.getElementById("year-from").value.trim(),
        car_year_to: document.getElementById("year-to").value.trim(),
        car_price_from: fromPrice.value,
        car_price_to: toPrice.value,
        car_price_tolerance: tolerance.value,
        car_mileage_to: document.getElementById("mileage").value.trim(),
        car_region: document.getElementById("region").value.trim(),
        car_poll_interval_seconds: Number(document.getElementById("car-interval").value),
        _priceError: fromPrice.error || toPrice.error,
        _toleranceError: tolerance.error
      };
    }

    async function save(extra) {
      const draft = formPatch();
      const priceError = draft._priceError;
      const toleranceError = draft._toleranceError;
      delete draft._priceError;
      delete draft._toleranceError;
      if (priceError) {
        toast(text("badPriceValue"));
        paint();
        return;
      }
      if (toleranceError && !(extra && Object.prototype.hasOwnProperty.call(extra, "car_price_tolerance"))) {
        toast(text("badTolerance"));
        paint();
        return;
      }
      const patch = Object.assign(draft, extra || {});
      if (patch.notify_from_date && patch.notify_before_date && patch.notify_from_date > patch.notify_before_date) {
        toast(text("badRange"));
        paint();
        return;
      }
      if (patch.car_year_from && patch.car_year_to && Number(patch.car_year_from) > Number(patch.car_year_to)) {
        toast(text("badYear"));
        paint();
        return;
      }
      if (patch.car_price_from && patch.car_price_to && Number(patch.car_price_from) > Number(patch.car_price_to)) {
        toast(text("badPrice"));
        paint();
        return;
      }
      const next = await commit(() => api("/api/state", patch));
      if (!next) return;
      state = next;
      lang = state.config.language === "uk" ? "uk" : "en";
      paint();
    }

    async function run(kind) {
      if (kind === "car" && !document.getElementById("make").value.trim()) {
        toast(text("needMake"));
        return;
      }
      await save();
      const list = kind === "car" ? state.car_searches || [] : state.ticket_searches || [];
      if (list.some((item) => item.current)) {
        toast(text("already"));
        paintChrome();
        return;
      }
      const next = await commit(() => api(kind === "car" ? "/api/car/start" : "/api/ticket/start", {}));
      if (!next) return;
      state = next;
      paint();
      toast(text("started"));
    }

    async function stopSearch(kind, key) {
      const before = (kind === "car" ? state.car_searches : state.ticket_searches).length;
      const next = await commit(() => api(kind === "car" ? "/api/car/stop" : "/api/ticket/stop", { key: key }));
      if (!next) return;
      state = next;
      const after = (kind === "car" ? state.car_searches : state.ticket_searches).length;
      drawnKey = "";
      paintChrome();
      toast(text(after < before ? "stopped" : "notRunning"));
    }

    async function stopAll() {
      const next = await commit(() => api("/api/stop-all", {}));
      if (!next) return;
      state = next;
      drawnKey = "";
      paintChrome();
      toast(text("stoppedAll"));
    }

    function askStopAll() {
      const message = text("confirmStopAll");
      if (tg && tg.showConfirm) {
        tg.showConfirm(message, (ok) => { if (ok) stopAll().catch((err) => toast(err.message)); });
        return;
      }
      if (window.confirm(message)) stopAll().catch((err) => toast(err.message));
    }

    async function openSearch(item) {
      tab = item.kind === "car" ? "cars" : "tickets";
      if (item.kind === "car") {
        await save({
          car_make: item.make,
          car_model: item.model,
          car_region: item.region,
          car_year_from: item.year_from,
          car_year_to: item.year_to,
          car_price_from: item.price_from,
          car_price_to: item.price_to,
          car_price_tolerance: item.price_tolerance || "0",
          car_mileage_to: item.mileage_to,
          car_fuel_type: item.fuel_type,
          car_gearbox: item.gearbox,
          car_poll_interval_seconds: item.poll_interval_seconds
        });
        return;
      }
      await save({
        service_key: item.service_key,
        num_cases: item.num_cases,
        notify_from_date: item.notify_from_date,
        notify_before_date: item.notify_before_date,
        poll_interval_seconds: item.poll_interval_seconds
      });
    }

    document.getElementById("lang-en").onclick = () => save({ language: "en" }).catch((err) => toast(err.message));
    document.getElementById("lang-uk").onclick = () => save({ language: "uk" }).catch((err) => toast(err.message));
    document.getElementById("tab-tickets").onclick = () => { tab = "tickets"; drawnKey = ""; paint(); };
    document.getElementById("tab-cars").onclick = () => { tab = "cars"; drawnKey = ""; paint(); };
    document.getElementById("start-ticket").onclick = () => run("ticket").catch((err) => toast(err.message));
    document.getElementById("start-car").onclick = () => run("car").catch((err) => toast(err.message));
    document.getElementById("stop-all").onclick = askStopAll;
    ["from", "until", "interval", "model", "year-from", "year-to", "mileage", "region", "car-interval"]
      .forEach((id) => document.getElementById(id).addEventListener("change", () => save().catch((err) => toast(err.message))));
    function bindPrice(selectId, manualId) {
      document.getElementById(selectId).addEventListener("change", () => {
        document.getElementById(manualId).value = "";
        save().catch((err) => toast(err.message));
      });
      const manual = document.getElementById(manualId);
      manual.addEventListener("input", paintWindow);
      manual.addEventListener("change", () => save().catch((err) => toast(err.message)));
    }
    bindPrice("price-from", "price-from-custom");
    bindPrice("price-to", "price-to-custom");
    const toleranceInput = document.getElementById("price-tolerance");
    toleranceInput.addEventListener("input", paintWindow);
    toleranceInput.addEventListener("change", () => save().catch((err) => toast(err.message)));
    document.getElementById("make").addEventListener("change", () => {
      const make = document.getElementById("make").value;
      const model = document.getElementById("model");
      const models = (options && options.models && options.models[make]) || [];
      if (!models.some((item) => item.id === model.value)) model.value = "";
      model.disabled = !make;
      save().catch((err) => toast(err.message));
    });

    async function refresh() {
      if (busy || document.hidden || !state) return;
      const seen = epoch;
      busy += 1;
      try {
        const next = await api("/api/state");
        if (seen !== epoch) return;
        const configSame = JSON.stringify(next.config) === JSON.stringify(state.config);
        state = next;
        if (configSame) paintChrome();
        else paint();
      } catch (err) {
        /* The next poll retries. A failed refresh should not wipe the form. */
      } finally {
        busy -= 1;
      }
    }

    async function boot() {
      if (preview) document.getElementById("preview").classList.remove("hidden");
      else {
        applyTheme();
        tg.ready();
        tg.expand();
        tg.onEvent("themeChanged", applyTheme);
      }
      [options, state] = await Promise.all([api("/api/options"), api("/api/state")]);
      state.ticket_searches = state.ticket_searches || [];
      state.car_searches = state.car_searches || [];
      lang = state.config.language === "uk" ? "uk" : (tg && tg.initDataUnsafe && String(tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code || "").startsWith("uk") ? "uk" : "en");
      paint();
      if (options.error) toast(text("catalogError"));
      if (lang !== state.config.language) await save({ language: lang });
      setInterval(() => refresh(), 5000);
    }

    boot().catch((err) => toast(err.message));
  </script>
</body>
</html>
