name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR != '' && secrets.VPS_APP_DIR || 'ticket-parser' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import os
          import pathlib
          raw = os.environ.get("SSH_KEY", "").replace("\r\n", "\n").replace("\r", "\n").strip().strip('"').strip("'")
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n").strip()
          path = pathlib.Path.home() / ".ssh" / "deploy_key"
          path.write_text(raw + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>~/key-error.txt; then
            echo "VPS_SSH_PRIVATE_KEY is not a usable private key."
            echo "Paste the private file (not the .pub), with BEGIN/END lines, and no passphrase."
            cat ~/key-error.txt
            exit 1
          fi
          echo "Connecting as ${VPS_USER}@${VPS_HOST}:${VPS_PORT}"
          echo "Key offered to the server:"
          ssh-keygen -lf ~/.ssh/deploy_key.pub
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            NumberOfPasswordPrompts 0
            BatchMode yes
          EOF

      - name: Upload application
        run: |
          ssh vps "mkdir -p $(printf '%q' "$VPS_APP_DIR")"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'user_config.json' \
            --exclude 'state.json' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            ./ "vps:${VPS_APP_DIR}/"

      - name: Install dependencies and restart
        run: |
          ssh vps "APP_DIR=$(printf '%q' "$VPS_APP_DIR") bash -s" < deploy/remote-update.sh
